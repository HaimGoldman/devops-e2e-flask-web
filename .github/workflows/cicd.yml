name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest tests/test_app.py -v

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
            ${{ vars.DOCKER_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ vars.DOCKER_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Create test namespace
        run: kubectl create namespace test

      - name: Create DB Secret from GitHub Secrets
        run: |
          kubectl create secret generic flask-db-secret \
            --from-literal=password='${{ secrets.DB_PASSWORD }}' \
            -n test \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy app and database to test namespace
        run: |
          helm upgrade --install flask-web-test helm \
            -f helm/values-dev.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            -n test

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=flask-web -n test --timeout=180s

      - name: Run integration tests in pod
        run: |
          cat tests/test_integration.py | kubectl run pytest-runner -n test \
            --image=python:3.10-slim --rm -i --restart=Never -- bash -c "
              pip install -q pytest requests && 
              cat > /tmp/test_integration.py && 
              export APP_URL=http://flask-web-test-svc && 
              pytest /tmp/test_integration.py -v
            "

      - name: Clean up test namespace
        if: always()
        run: kubectl delete namespace test

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build-and-push, integration-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Create dev namespace
        run: kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create DB Secret from GitHub Secrets
        run: |
          kubectl create secret generic flask-db-secret \
            --from-literal=password='${{ secrets.DB_PASSWORD }}' \
            -n dev \
            --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Deploy to Dev with Helm
        run: |
          helm upgrade --install flask-web helm \
            -f helm/values-dev.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            -n dev

      - name: Verify deployment
        run: |
          kubectl get pods -n dev
          kubectl get svc -n dev

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-dev]
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Create prod namespace
        run: kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Create DB Secret from GitHub Secrets
        run: |
          kubectl create secret generic flask-db-secret \
            --from-literal=password='${{ secrets.DB_PASSWORD }}' \
            -n prod \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Prod with Helm
        run: |
          helm upgrade --install flask-web helm \
            -f helm/values-prod.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            -n prod

      - name: Verify deployment
        run: |
          kubectl get pods -n prod
          kubectl get svc -n prod
