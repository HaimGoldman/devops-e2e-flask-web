name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ vars.DOCKER_REPOSITORY }}:${{ steps.set-tag.outputs.tag }} -t ${{ vars.DOCKER_REPOSITORY }}:latest .

      - name: Push Docker image
        run: |
          docker push ${{ vars.DOCKER_REPOSITORY }}:${{ steps.set-tag.outputs.tag }}
          docker push ${{ vars.DOCKER_REPOSITORY }}:latest

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Create dev namespace
        run: kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Dev with Helm
        run: |
          helm upgrade --install flask-web helm \
            -f helm/values-dev.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            -n dev

      - name: Verify deployment
        run: |
          kubectl get pods -n dev
          kubectl get svc -n dev

  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Create prod namespace
        run: kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Prod with Helm
        run: |
          helm upgrade --install flask-web helm \
            -f helm/values-prod.yaml \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            -n prod

      - name: Verify deployment
        run: |
          kubectl get pods -n prod
          kubectl get svc -n prod
