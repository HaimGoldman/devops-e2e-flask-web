replicaCount: 3

image:
  repository: haimgoldman/flask-web
  tag: v3.1
  pullPolicy: IfNotPresent

container:
  name: flask-web-container
  port: 8000

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  className: nginx
  host: flask.local
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

deployment:
  annotations: {}

postgres:
  image: postgres
  tag: "15"
  database: visitsdb
  user: postgres
  password: password
  storage: 1Gi
  usePersistentVolume: true  # Set to false for EKS without EBS CSI driver

monitoring:
  prometheus:
    image: prom/prometheus
    tag: v2.48.0
    port: 9090
  grafana:
    image: grafana/grafana
    tag: 10.2.2
    adminPassword: admin
    serviceType: ClusterIP
    port: 3000
    rbac:
      create: true
    serviceAccount:
      create: true
      name: grafana-sa
    sidecar:
      image: quay.io/kiwigrid/k8s-sidecar
      tag: 1.25.2
      dashboards:
        enabled: true
        label: grafana_dashboard
        folder: /tmp/dashboards
        searchNamespace: ALL

labels:
  app: flask-web
  environment: ""
