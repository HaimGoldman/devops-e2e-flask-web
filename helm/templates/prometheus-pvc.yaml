{{- if .Values.monitoring.prometheus.usePersistentVolume }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-prometheus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.monitoring.prometheus.storageClassName }}
  storageClassName: {{ .Values.monitoring.prometheus.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.monitoring.prometheus.storage }}
{{- end }}
