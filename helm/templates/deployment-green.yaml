{{- if .Values.blueGreen.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-green
  labels:
    app: {{ .Values.labels.app }}
    version: green
spec:
  replicas: {{ .Values.blueGreen.green.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.labels.app }}
      version: green
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ .Values.deployment.strategy.maxSurge }}
      maxUnavailable: {{ .Values.deployment.strategy.maxUnavailable }}
  template:
    metadata:
      labels:
        app: {{ .Values.labels.app }}
        version: green
    spec:
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}:{{ .Values.postgres.tag }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-postgres-svc -p {{ .Values.postgres.port }} -U {{ .Values.postgres.user }}; do
                echo "Waiting for PostgreSQL to be ready..."
                sleep 2
              done
      containers:
        - name: {{ .Values.container.name }}
          image: {{ .Values.image.repository }}:{{ .Values.blueGreen.green.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.container.port }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: {{ .Values.deployment.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.deployment.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.readinessProbe.timeoutSeconds }}
            successThreshold: {{ .Values.deployment.readinessProbe.successThreshold }}
            failureThreshold: {{ .Values.deployment.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.container.port }}
            initialDelaySeconds: {{ .Values.deployment.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.deployment.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.deployment.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.deployment.livenessProbe.failureThreshold }}
          env:
            - name: DB_HOST
              value: {{ .Release.Name }}-postgres-svc
            - name: DB_NAME
              value: {{ .Values.postgres.database }}
            - name: DB_USER
              value: {{ .Values.postgres.user }}
            - name: DB_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: DB_PORT
              value: "{{ .Values.postgres.port }}"
{{- end }}
