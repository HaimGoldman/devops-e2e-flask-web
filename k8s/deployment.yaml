apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-web-deployment
  labels:
    app: flask-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flask-web
  template:
    metadata:
      labels:
        app: flask-web
    spec:
      containers:
        - name: flask-web-container
          image: haimgoldman/flask-web:v2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: flask-web-port
              containerPort: 8000